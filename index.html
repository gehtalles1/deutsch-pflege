digkeiten verteilt sind."},{"id":"v38","term":"die Beschwerde","zh":"投诉","example":"Die Beschwerde wird ernst genommen und sachlich dokumentiert."},{"id":"v39","term":"die Ansprechperson","zh":"联系人／对接人员","example":"Die Ansprechperson erklärt, wer bei weiteren Fragen helfen kann."},{"id":"v40","term":"der Ablauf","zh":"流程","example":"Der Ablauf wird dem Patienten in einfachen Worten erklärt."},{"id":"v41","term":"die Wartezeit","zh":"等候时间","example":"Die Wartezeit wird verständlich kommuniziert, sobald verlässliche Informationen vorliegen."},{"id":"v42","term":"die Patienteninformation","zh":"患者须知／患者信息","example":"Die Patienteninformation erklärt wichtige Abläufe und Rechte in verständlicher Sprache."}]},{"id":"t8","title":"Gesundheitliche Probleme I","group":"Symptome und Beobachtung","desc":"常见症状、主诉与病情观察","terms":[{"id":"v43","term":"das Symptom","zh":"症状","example":"Das Symptom wird genau beschrieben und bei Bedarf an das zuständige Team weitergegeben."},{"id":"v44","term":"der Schwindel","zh":"头晕","example":"Der Schwindel tritt beim Aufstehen auf; ich sichere die Situation und informiere das Team."},{"id":"v45","term":"die Übelkeit","zh":"恶心","example":"Die Übelkeit begann nach dem Essen und wird im Pflegebericht festgehalten."},{"id":"v46","term":"das Fieber","zh":"发热","example":"Das Fieber wird gemessen und nach dem geltenden Standard weitergemeldet."},{"id":"v47","term":"der Husten","zh":"咳嗽","example":"Der Husten hat sich seit gestern verändert; die Beobachtung wird dokumentiert."},{"id":"v48","term":"die Atemnot","zh":"呼吸困难","example":"Die Atemnot ist neu aufgetreten und wird zeitnah nach dem Hausstandard gemeldet."}]},{"id":"t9","title":"Gesundheitliche Probleme II","group":"Symptome und Beobachtung","desc":"体力、睡眠、胃肠与食欲问题","terms":[{"id":"v49","term":"die Müdigkeit","zh":"疲劳","example":"Die Müdigkeit ist heute stärker als am Vortag und wird im Pflegebericht festgehalten."},{"id":"v50","term":"die Schwäche","zh":"虚弱","example":"Die Schwäche erschwert dem Patienten das Aufstehen."},{"id":"v51","term":"die Verstopfung","zh":"便秘","example":"Die Verstopfung wird im Gespräch mit der zuständigen Pflegefachkraft angesprochen."},{"id":"v52","term":"der Durchfall","zh":"腹泻","example":"Der Durchfall wird mit Beginn und Häufigkeit sachlich dokumentiert."},{"id":"v53","term":"die Schlafstörung","zh":"睡眠障碍","example":"Die Schlafstörung beeinträchtigt die nächtliche Erholung."},{"id":"v54","term":"der Appetitverlust","zh":"食欲减退","example":"Der Appetitverlust wird bei der Beobachtung der Nahrungsaufnahme berücksichtigt."}]},{"id":"t10","title":"Allgemeine Tätigkeiten","group":"Pflegepraxis","desc":"基础护理操作、观察和协助","terms":[{"id":"v55","term":"die Körperpflege","zh":"身体清洁护理","example":"Die Körperpflege wird erklärt und an die Wünsche der pflegebedürftigen Person angepasst."},{"id":"v56","term":"die Mobilisation","zh":"活动／下床活动","example":"Die Mobilisation erfolgt entsprechend der individuellen Belastbarkeit und des vereinbarten Pflegeplans."},{"id":"v57","term":"die Lagerung","zh":"体位摆放","example":"Die Lagerung wird regelmäßig überprüft und bei Bedarf angepasst."},{"id":"v58","term":"die Beobachtung","zh":"观察","example":"Die Beobachtung des Allgemeinzustands gehört zu den täglichen Pflegeaufgaben."},{"id":"v59","term":"die Unterstützung","zh":"支持／协助","example":"Die Unterstützung wird so angeboten, dass die Selbstständigkeit möglichst erhalten bleibt."},{"id":"v60","term":"die Hilfeleistung","zh":"提供帮助","example":"Die Hilfeleistung richtet sich nach dem tatsächlichen Bedarf der Patientin."}]},{"id":"t11","title":"Pflegeplanung und Gewichtskontrolle","group":"Pflegepraxis","desc":"护理计划、目标、措施与体重记录","terms":[{"id":"v61","term":"der Pflegeplan","zh":"护理计划","example":"Der Pflegeplan hält vereinbarte Maßnahmen und Zuständigkeiten übersichtlich fest."},{"id":"v62","term":"das Pflegeziel","zh":"护理目标","example":"Das Pflegeziel beschreibt, welche Veränderung erreicht und überprüft werden soll."},{"id":"v63","term":"die Pflegemaßnahme","zh":"护理措施"," ung und Beobachtung überprüft."}]},{"id":"t30","title":"Herz: Anatomie und Diagnosen","group":"Körper und Krankheiten","desc":"心脏结构、节律及常见诊断","terms":[{"id":"v175","term":"das Herz","zh":"心脏","example":"Das Herz pumpt Blut durch den Körper und versorgt die Organe."},{"id":"v176","term":"der Herzmuskel","zh":"心肌","example":"Der Herzmuskel zieht sich rhythmisch zusammen, um das Blut weiterzuleiten."},{"id":"v177","term":"die Herzklappe","zh":"心脏瓣膜","example":"Die Herzklappe unterstützt den gerichteten Blutfluss zwischen den Herzhöhlen und Gefäßen."},{"id":"v178","term":"der Herzrhythmus","zh":"心律","example":"Der Herzrhythmus wird bei der vorgesehenen Untersuchung kontrolliert."},{"id":"v179","term":"die Herzinsuffizienz","zh":"心力衰竭","example":"Die Herzinsuffizienz wird durch die zuständige medizinische Fachperson erklärt und behandelt."},{"id":"v180","term":"der Herzinfarkt","zh":"心肌梗死","example":"Der Herzinfarkt ist ein akuter medizinischer Notfall und erfordert sofortige Hilfe nach dem Notfallplan."}]},{"id":"t31","title":"Herz-Kreislauf-Stillstand","group":"Notfall und Sicherheit","desc":"急救沟通、呼救与团队应急流程","terms":[{"id":"v181","term":"der Herz-Kreislauf-Stillstand","zh":"心搏骤停","example":"Der Herz-Kreislauf-Stillstand erfordert sofortiges Handeln nach dem Notfallplan der Einrichtung."},{"id":"v182","term":"die Wiederbelebung","zh":"复苏","example":"Die Wiederbelebung erfolgt durch entsprechend geschulte Personen nach den geltenden Notfallstandards."},{"id":"v183","term":"der Notruf","zh":"紧急呼叫","example":"Der Notruf wird bei einer akuten Gefahr unverzüglich nach dem festgelegten Verfahren ausgelöst."},{"id":"v184","term":"die Herzdruckmassage","zh":"胸外按压","example":"Die Herzdruckmassage gehört zu den Maßnahmen der Wiederbelebung und wird nach aktueller Schulung durchgeführt."},{"id":"v185","term":"der Defibrillator","zh":"除颤仪","example":"Der Defibrillator wird im Notfall entsprechend der Ausbildung und den Geräteanweisungen eingesetzt."},{"id":"v186","term":"die Notfallkette","zh":"急救响应链","example":"Die Notfallkette beschreibt, wie Hilfe alarmiert und die Versorgung im Team organisiert wird."}]},{"id":"t32","title":"Herzoperationen","group":"Diagnostik und Pflege","desc":"心脏术后观察、切口和引流相关词汇","terms":[{"id":"v187","term":"die Herzoperation","zh":"心脏手术","example":"Die Herzoperation wird vor dem Eingriff verständlich erklärt und organisatorisch vorbereitet."},{"id":"v188","term":"die Narbe","zh":"瘢痕","example":"Die Narbe wird im Verlauf beobachtet und bei Auffälligkeiten gemeldet."},{"id":"v189","term":"die Drainage","zh":"引流管／引流","example":"Die Drainage wird nach dem geltenden Standard kontrolliert und dokumentiert."},{"id":"v190","term":"die Überwachung","zh":"监测","example":"Die Überwachung richtet sich nach dem Zustand und dem postoperativen Plan."},{"id":"v191","term":"die Nachbehandlung","zh":"术后治疗／后续处理","example":"Die Nachbehandlung wird mit den zuständigen Fachpersonen abgestimmt."},{"id":"v192","term":"die Operationswunde","zh":"手术伤口","example":"Die Operationswunde wird beobachtet und nach dem vorgegebenen Standard dokumentiert."}]},{"id":"t33","title":"Dekubitus","group":"Pflegepraxis","desc":"压力性损伤、皮肤观察和减压护理","terms":[{"id":"v193","term":"der Dekubitus","zh":"压力性损伤／压疮","example":"Der Dekubitus wird fachgerecht beurteilt und gemäß dem Standard dokumentiert."},{"id":"v194","term":"die Druckstelle","zh":"受压部位","example":"Die Druckstelle wird regelmäßig beobachtet und bei Veränderungen weitergemeldet."},{"id":"v195","term":"die Hautrötung","zh":"皮肤发红","example":"Die Hautrötung wird sachlich beschrieben und nach den geltenden Vorgaben beurteilt."},{"id":"v196","term":"die Umlagerung","zh":"翻身／体位调整","example":"Die Umlagerung erfolgt entsprechend dem individuellen Pflegeplan."},{"id":"v197","term":"die Druckentlastung","zh":"减压","example":"Die Druckentlastung wird in die vereinbarten pflegerischen Maßnahmen aufgenommen."},{"id":"v198","term":"die Wundauflage","zh":"伤口敷料","example":"Die Wundauflage wird nach dem vorgegebenen Verband- und Hygienestandard ausgewählt."}]},{"id":"t34","title":"Verbandswechsel","group":"Pflegepraxis","desc":"换药、敷料、固定材料与无菌流程","terms":[{"id":"v199","term":"der Verbandswechsel","zh":"更换敷料／换药","example":"Der Verbandswechsel wird vorbereitet und nach den geltenden Hygienevorgaben durchgeführt."},{"id":"v200","term":"die sterile Kompresse","zh":"无菌纱布","example":"Die sterile Kompresse bleibt bis zur sachgerechten Verwendung steril."},{"id":"v201","term":"die Wundauflage","zh":"伤口敷料","example":"Die Wundauflage wird entsprechend der Wundsituation und dem geltenden Standard gewählt."},{"id":"v202","term":"die Fixierbinde","zh":"固定绷带","example":"Die Fixierbinde hält den Verband an der vorgesehenen Stelle."},{"id":"v203","term":"die Händedesinfektion","zh":"手消毒","example":"Die Händedesinfektion erfolgt zu den festgelegten Zeitpunkten nach Hygieneplan."},{"id":"v204","term":"das Verbandsmaterial","zh":"敷料材料","example":"Das Verbandsmaterial wird vollständig und passend zur vorgesehenen Maßnahme bereitgelegt."}]},{"id":"t35","title":"Wunden dokumentieren","group":"Dokumentation","desc":"描述伤口部位、边缘、深度、分泌物与愈合","terms":[{"id":"v205","term":"die Wunde","zh":"伤口","example":"Die Wunde wird anhand sichtbarer Merkmale sachlich beschrieben."},{"id":"v206","term":"der Wundrand","zh":"伤口边缘","example":"Der Wundrand wird auf erkennbare Veränderungen beobachtet."},{"id":"v207","term":"die Wundtiefe","zh":"伤口深度","example":"Die Wundtiefe wird nach dem festgelegten Dokumentationsstandard erfasst."},{"id":"v208","term":"das Wundsekret","zh":"伤口渗出液","example":"Das Wundsekret wird nach Aussehen und Menge gemäß Vorgabe beschrieben."},{"id":"v209","term":"die Wunddokumentation","zh":"伤口记录","example":"Die Wunddokumentation enthält konkrete Beobachtungen und den zeitlichen Verlauf."},{"id":"v210","term":"die Wundheilung","zh":"伤口愈合","example":"Die Wundheilung wird bei den vorgesehenen Kontrollen beobachtet und dokumentiert."}]},{"id":"t36","title":"Todesfälle","group":"Kommunikation und Ethik","desc":"尊重、哀伤沟通与逝者照护表达","terms":[{"id":"v211","term":"der Todesfall","zh":"死亡事件","example":"Der Todesfall wird nach dem festgelegten Ablauf gemeldet und dokumentiert."},{"id":"v212","term":"die Todesbescheinigung","zh":"死亡证明","example":"Die Todesbescheinigung wird von der dafür zuständigen Person nach den geltenden Regeln erstellt."},{"id":"v213","term":"die angehörige Person","zh":"家属／相关亲属","example":"Die angehörige Person erhält eine ruhige, respektvolle Ansprache und verlässliche Informationen."},{"id":"v214","term":"die Abschiednahme","zh":"告别","example":"Die Abschiednahme wird nach Möglichkeit respektvoll und entsprechend dem Wunsch der Angehörigen begleitet."},{"id":"v215","term":"die Versorgung Verstorbener","zh":"逝者照护","example":"Die Versorgung Verstorbener erfolgt würdevoll und gemäß den Vorgaben der Einrichtung."},{"id":"v216","term":"der respektvolle Umgang","zh":"尊重的对待方式","example":"Der respektvolle Umgang zeigt sich in Sprache, Verhalten und dem Schutz der Würde."}]},{"id":"t37","title":"MRSA","group":"Hygiene und Sicherheit","desc":"耐药菌、筛查、隔离与防护用语","terms":[{"id":"v217","term":"der Erreger","zh":"病原体","example":"Der Erreger wird je nach Situation durch geeignete diagnostische Verfahren nachgewiesen."},{"id":"v218","term":"die Besiedlung","zh":"定植","example":"Die Besiedlung bedeutet, dass ein Erreger vorhanden ist, ohne dass damit automatisch eine Infektion vorliegt."},{"id":"v219","term":"die Infektion","zh":"感染","example":"Die Infektion wird anhand der klinischen Situation durch die zuständigen Fachpersonen beurteilt."},{"id":"v220","term":"der Abstrich","zh":"拭子采样","example":"Der Abstrich wird nach den geltenden Hygiene- und Kennzeichnungsvorgaben entnommen und zugeordnet."},{"id":"v221","term":"die Isolationsmaßnahme","zh":"隔离措施","example":"Die Isolationsmaßnahme richtet sich nach den aktuellen Hygieneanweisungen der Einrichtung."},{"id":"v222","term":"die Schutzkleidung","zh":"防护服／防护衣","example":"Die Schutzkleidung wird entsprechend dem festgelegten Hygieneplan verwendet."}]},{"id":"t38","title":"Prophylaxen","group":"Sicherheit und Prävention","desc":"预防性护理、活动、呼吸和关节活动","terms":[{"id":"v223","term":"die Prophylaxe","zh":"预防措施","example":"Die Prophylaxe wird an das individuelle Risiko und den vereinbarten Pflegeplan angepasst."},{"id":"v224","term":"die Mobilisation","zh":"活动／下床活动","example":"Die Mobilisation unterstützt Beweglichkeit, wenn sie zur Situation und zum Pflegeplan passt."},{"id":"v225","term":"die Atemübung","zh":"呼吸练习","example":"Die Atemübung wird verständlich erklärt und entsprechend der Anleitung durchgeführt."},{"id":"v226","term":"die Lagerung","zh":"体位摆放","example":"Die Lagerung wird auf das Wohlbefinden und die vereinbarten Pflegeziele abgestimmt."},{"id":"v227","term":"die Mundpflege","zh":"口腔护理","example":"Die Mundpflege unterstützt Mundgesundheit und Wohlbefinden."},{"id":"v228","term":"die Kontrakturprophylaxe","zh":"挛缩预防","example":"Die Kontrakturprophylaxe umfasst individuell vereinbarte Maßnahmen zur Erhaltung der Beweglichkeit."}]},{"id":"t39","title":"Krebserkrankungen","group":"Körper und Krankheiten","desc":"肿瘤、治疗方式、不良反应与姑息照护","terms":[{"id":"v229","term":"die Krebserkrankung","zh":"癌症／恶性肿瘤疾病","example":"Die Krebserkrankung wird durch die zuständigen Fachpersonen diagnostisch eingeordnet und behandelt."},{"id":"v230","term":"der Tumor","zh":"肿瘤","example":"Der Tumor wird anhand der vorgesehenen Untersuchungen genauer beurteilt."},{"id":"v231","term":"die Chemotherapie","zh":"化学治疗","example":"Die Chemotherapie wird nach dem individuellen Behandlungsplan durchgeführt und begleitet."},{"id":"v232","term":"die Bestrahlung","zh":"放射治疗","example":"Die Bestrahlung erfolgt nach dem festgelegten Therapieplan."},{"id":"v233","term":"die Nebenwirkung","zh":"副作用","example":"Die Nebenwirkung wird erfragt, dokumentiert und bei Bedarf an das Behandlungsteam weitergegeben."},{"id":"v234","term":"die Palliativpflege","zh":"姑息护理","example":"Die Palliativpflege richtet sich auf Lebensqualität, Linderung belastender Symptome und individuelle Bedürfnisse."}]},{"id":"t40","title":"Arbeitssicherheit","group":"Hygiene und Sicherheit","desc":"个人防护、手卫生与职业风险","terms":[{"id":"v235","term":"die Arbeitssicherheit","zh":"工作安全","example":"Die Arbeitssicherheit schützt Beschäftigte durch klare Regeln und geeignete Maßnahmen."},{"id":"v236","term":"die Schutzbrille","zh":"防护眼镜","example":"Die Schutzbrille wird getragen, wenn die Gefährdungsbeurteilung sie vorsieht."},{"id":"v237","term":"der Einmalhandschuh","zh":"一次性手套（单只）","example":"Der Einmalhandschuh wird nach Gebrauch fachgerecht entsorgt und nicht wiederverwendet."},{"id":"v238","term":"die Händehygiene","zh":"手卫生","example":"Die Händehygiene wird zu den festgelegten Zeitpunkten nach dem Hygieneplan durchgeführt."},{"id":"v239","term":"die Nadelstichverletzung","zh":"针刺伤","example":"Die Nadelstichverletzung wird sofort nach dem betrieblichen Verfahren gemeldet und versorgt."},{"id":"v240","term":"die Gefährdungsbeurteilung","zh":"风险评估","example":"Die Gefährdungsbeurteilung hilft, Risiken am Arbeitsplatz zu erkennen und geeignete Schutzmaßnahmen festzulegen."}]}],"scenarios":[{"topic":1,"title":"Rollen klären","scene":"Eine neue Kollegin beginnt heute auf der Station. Du weißt nicht, wer die Praxisanleitung übernimmt.","q":"Wie fragst du professionell nach?","options":["Ich mache einfach alles allein.","Das ist bestimmt egal.","Warum sagt mir niemand etwas?","Wer ist heute für meine Praxisanleitung zuständig?"],"correct":3,"why":"Eine konkrete, sachliche Frage klärt die Zuständigkeit und klingt professionell.","id":"s1","topicId":"t1","sceneZh":"一位新同事今天到病区上班。你还不清楚由谁负责临床带教。","qZh":"怎样礼貌、专业地询问？","whyZh":"直接询问由谁负责带教，可以明确职责，避免靠猜测行动。专业沟通应具体、客观，不必责怪同事。","optionsZh":["我自己把所有事情都做完。","这应该无所谓。","为什么没人告诉我？","今天谁负责我的临床带教？"]},{"topic":2,"title":"Übergabe","scene":"Deine Schicht endet. Eine wichtige Beobachtung muss an das nächste Team weitergegeben werden.","q":"Welche Formulierung passt?","options":["Ich habe noch eine wichtige Beobachtung zur Patientin: …","Keine Ahnung, fragen Sie jemand anderen.","Sie wissen ja schon alles.","Das erzähle ich irgendwann."],"correct":0,"why":"Wichtige Informationen werden strukturiert und rechtzeitig übergeben.","id":"s2","topicId":"t2","sceneZh":"你的班次即将结束，有一项重要观察结果需要交接给下一班。","qZh":"哪一种交接表达合适？","whyZh":"交班应及时传递重要观察和未完成事项，让下一班能够接续护理。","optionsZh":["我还有一项关于这位患者的重要观察要交接：……","我不知道，去问别人。","你们已经什么都知道了。","我哪天再说吧。"]},{"topic":3,"title":"Aufnahmegespräch","scene":"Eine Patientin kommt zur Aufnahme und wirkt nervös.","q":"Wie beginnst du freundlich und verständlich?","options":["Setzen Sie sich hin und unterschreiben Sie alles.","Guten Tag, ich erkläre Ihnen kurz den Ablauf und stelle Ihnen einige Fragen.","Das geht jetzt schnell, keine Fragen.","Sie müssen das doch wissen."],"correct":1,"why":"Eine klare Erklärung und eine respektvolle Begrüßung fördern Orientierung und Vertrauen.","id":"s3","topicId":"t3","sceneZh":"一位患者来办理入院，看起来有些紧张。","qZh":"怎样开始对话，既友好又容易理解？","whyZh":"先问候并说明流程，能帮助患者了解接下来会发生什么，也有助于建立信任。","optionsZh":["坐下，把所有文件都签了。","您好，我先简单介绍流程，再问您几个问题。","现在很快就好，不要问问题。","这不是您应该知道的吗？"]},{"topic":4,"title":"Entlassung","scene":"Ein Patient fragt, welche Unterlagen er beim Verlassen der Klinik erhält.","q":"Welche Antwort ist sprachlich passend?","options":["Das betrifft mich nicht.","Sie brauchen nichts zu wissen.","Ich kläre mit dem zuständigen Team, welche Unterlagen Sie zur Entlassung bekommen.","Nehmen Sie einfach irgendetwas mit."],"correct":2,"why":"Bei organisatorischen Fragen ist eine klare Zuständigkeitsklärung besser als Vermutungen.","id":"s4","topicId":"t4","sceneZh":"一位患者询问离开医院时会拿到哪些文件。","qZh":"哪一种回答更恰当？","whyZh":"遇到自己不能独立确认的行政信息，应说明会向负责团队核实，不要随意猜测。","optionsZh":["这不归我管。","您不需要知道。","我和负责团队确认一下，您出院时会拿到哪些文件。","随便拿点东西走吧。"]},{"topic":5,"title":"Teambesprechung","scene":"Du bist mit einer geplanten Maßnahme nicht sicher und möchtest Rücksprache halten.","q":"Welche Aussage ist konstruktiv?","options":["Das mache ich einfach anders.","Das ist alles Unsinn.","Ich sage lieber nichts.","Können wir die Maßnahme kurz gemeinsam besprechen?"],"correct":3,"why":"Rückfragen und Absprachen unterstützen Teamarbeit und sichere Abläufe.","id":"s5","topicId":"t5","sceneZh":"你对计划中的一项护理措施不太确定，希望和团队确认。","qZh":"哪一种表达体现了建设性的团队沟通？","whyZh":"遇到不确定的护理措施，应先沟通和确认；擅自改变计划可能导致信息不一致。","optionsZh":["我就按自己的方法改了。","这全是胡说。","我还是不说了。","我们可以一起简单讨论一下这项措施吗？"]},{"topic":6,"title":"Telefonat","scene":"Du rufst eine andere Abteilung an, aber die zuständige Person ist nicht erreichbar.","q":"Was sagst du?","options":["Sagen Sie einfach irgendwem Bescheid.","Könnten Sie bitte eine Rückrufbitte weitergeben?","Dann ist es mir egal.","Ich rufe ohne Erklärung immer wieder an."],"correct":1,"why":"Eine höfliche Rückrufbitte macht den nächsten Schritt klar.","id":"s6","topicId":"t6","sceneZh":"你打电话给另一个科室，但负责的同事暂时不在。","qZh":"你可以怎样说？","whyZh":"礼貌提出回电请求能让对方清楚下一步要做什么，也方便信息传递。","optionsZh":["随便告诉一个人就行。","您能帮忙转达一下请对方回电的请求吗？","那我不在乎了。","我不作说明，一直重复打电话。"]},{"topic":7,"title":"Beschwerde","scene":"Ein Angehöriger beschwert sich über eine lange Wartezeit.","q":"Welche Reaktion ist angemessen?","options":["Sie müssen eben warten.","Ich verstehe, dass die Wartezeit belastend ist. Ich erkundige mich nach dem aktuellen Stand.","Das ist nicht mein Problem.","Beruhigen Sie sich endlich."],"correct":1,"why":"Die Sorge wird anerkannt, anschließend wird eine überprüfbare nächste Handlung angeboten.","id":"s7","topicId":"t7","sceneZh":"一位患者家属因为等候时间太长而提出投诉。","qZh":"哪一种回应比较合适？","whyZh":"先承认家属对等候的担忧，再去核实实际情况，比责怪或承诺未知结果更专业。","optionsZh":["您就只能等着。","我理解等待会让人很难受。我去了解一下目前的情况。","这不是我的问题。","你赶快冷静下来。"]},{"topic":8,"title":"Atemnot mitteilen","scene":"Ein Patient berichtet über neu aufgetretene Atemnot.","q":"Was ist als Kommunikation im Team passend?","options":["Das wird von allein verschwinden.","Ich dokumentiere es irgendwann, ohne jemanden zu informieren.","Der Patient berichtet über neu aufgetretene Atemnot. Ich informiere sofort die zuständige Pflegefachkraft bzw. das Behandlungsteam nach Hausstandar sicherte medizinische Erklärung.","id":"s22","topicId":"t22","sceneZh":"一位患者询问为什么要抽血，但你不确定具体的医学原因。","qZh":"如果不确定确切原因，应怎样回应？","whyZh":"对自己不确定的医学原因应坦诚说明，并请负责的专业人员解释，不要编造理由。","optionsZh":["我不想给您错误信息，我会向负责的专业人员确认具体原因。","我编一个理由。","一直都是这样。","这不关您的事。"]},{"topic":23,"title":"Intimsphäre","scene":"Du bereitest die Körperpflege vor.","q":"Welche Maßnahme zeigt Respekt?","options":["Die Tür offen lassen, damit es schneller geht.","Ablauf erklären, Zustimmung einholen und nur den benötigten Bereich freilegen.","Ohne Ankündigung beginnen.","Privatsphäre als unwichtig behandeln."],"correct":1,"why":"Schutz der Intimsphäre und respektvolle Kommunikation gehören zur professionellen Pflege.","id":"s23","topicId":"t23","sceneZh":"你正在准备为患者进行身体清洁护理。","qZh":"哪一种做法体现了尊重？","whyZh":"身体护理前应说明步骤、征求同意，并只暴露护理所需部位，以保护患者的私密性和尊严。","optionsZh":["为了快些，把门开着。","解释流程、征求同意，并只暴露必要部位。","不说一声就开始。","隐私不重要。"]},{"topic":24,"title":"Sturzrisiko","scene":"Ein Patient wirkt beim Aufstehen unsicher.","q":"Welche Reaktion passt?","options":["Ich lasse ihn ohne Hilfsmittel allein gehen.","Ich entferne die Klingel.","Ich sichere die Situation, beachte den vereinbarten Unterstützungsbedarf und informiere bei Bedarf das Team.","Ich sage, Stürze passieren eben."],"correct":2,"why":"Risiken werden wahrgenommen und nach individuellem Plan und Hausstandard berücksichtigt.","id":"s24","topicId":"t24","sceneZh":"一位患者起身时显得不太稳。","qZh":"怎样回应更合适？","whyZh":"应先确保情境安全，遵循患者个别化的协助计划，并按需通知团队，不能让患者独自冒险活动。","optionsZh":["不使用辅助工具，让患者独自走。","把呼叫铃拿走。","先确保现场安全，遵循约定的协助计划，必要时通知团队。","跌倒反正难免。"]},{"topic":25,"title":"Rückenschmerz","scene":"Ein Patient berichtet über stärkere Rückenschmerzen als zuvor.","q":"Wie dokumentierst und kommunizierst du die Aussage?","options":["Er hat wahrscheinlich nur keine Lust.","Keine Besonderheiten, obwohl die Aussage neu ist.","Der Patient übertreibt immer.","Der Patient berichtet, dass die Rückenschmerzen seit heute stärker sind."],"correct":3,"why":"Zeitlicher Verlauf und Patientenaussage werden neutral beschrieben.","id":"s25","topicId":"t25","sceneZh":"一位患者说自己的背痛比之前更严重了。","qZh":"怎样客观记录并转达患者的陈述？","whyZh":"记录时应保留患者的原意和时间信息，避免判断患者是否夸大。","optionsZh":["他可能只是不想动。","虽然患者有新主诉，但记录“没有异常”。","患者总是夸大。","患者表示从今天起背痛加重。"]},{"topic":26,"title":"Beinbeschwerden","scene":"Ein Patient berichtet über neu aufgetretene einseitige Beinschwellung.","q":"Was ist sprachlich und organisatorisch angemessen?","options":["Ich verspreche, dass es harmlos ist.","Ich warte mehrere Tage.","Ich empfehle eigenständig eine Therapie.","Ich dokumentiere die Beobachtung sachlich und informiere zeitnah die zuständige Fachperson nach Standard."],"correct":3,"why":"Neue auffällige Veränderungen werden nicht diagnostisch bewertet oder ignoriert, sondern zeitnah weitergegeben.","id":"s26","topicId":"t26","sceneZh":"一位患者报告新出现的单侧腿部肿胀。","qZh":"在表达和流程处理上，怎样做合适？","whyZh":"新出现的单侧腿肿胀应客观记录并及时报告，不应自行断定无害、延迟处理或擅自开出治疗建议。","optionsZh":["我保证这没事。","我等几天再说。","我自行推荐一种治疗。","我会客观记录观察结果，并按流程及时通知负责的专业人员。"]},{"topic":27,"title":"Hilfsmittel","scene":"Eine Patientin möchte ihren Rollator nutzen, aber die Bremsen sind nicht festgestellt.","q":"Was ist die sichere Kommunikation?","options":["Bitte warten Sie kurz. Ich prüfe zuerst, ob das Hilfsmittel sicher bereitsteht.","Gehen Sie einfach los.","Ich halte das für unnötig.","Der Rollator ist bestimmt in Ordnung."],"correct":0,"why":"Vor der Nutzung wird die sichere Bereitstellung des Hilfsmittels geprüft.","id":"s27","topicId":"t27","sceneZh":"一位患者想使用助行器，但助行器的刹车尚未固定。","qZh":"怎样沟通才安全？","whyZh":"使用助行器前先确认设备处于安全状态，能减少不必要的跌倒风险。","optionsZh":["请稍等，我先确认这个辅助设备是否处于安全可用状态。","您直接走吧。","我觉得没必要检查。","助行器肯定没问题。"]},{"topic":28,"title":"Orientierung","scene":"Ein Bewohner mit Demenz fragt wiederholt, wann seine Tochter kommt.","q":"Welche Reaktion ist unterstützend?","options":["Ich ignoriere die Frage.","Sie warten auf Ihre Tochter. Ich schaue mit Ihnen nach, ob es eine aktuelle Information gibt.","Hören Sie auf zu fragen.","Das habe ich Ihnen schon zehnmal gesagt."],"correct":1,"why":"Ruhige, wertschätzende Kommunikation gibt Orientierung, ohne die Person abzuwerten.","id":"s28","topicId":"t28","sceneZh":"一位患有认知障碍的住民反复询问女儿什么时候来。","qZh":"哪一种回应有助于患者获得支持和方向感？","whyZh":"平静、尊重的表达和一起核实信息，能帮助认知障碍患者获得支持，避免羞辱或斥责。","optionsZh":["我不理会这个问题。","您在等女儿。我和您一起看看有没有最新消息。","别再问了。","我已经跟您说过十遍了。"]},{"topic":29,"title":"Schmerzen erfassen","scene":"Eine Patientin sagt: „Es tut sehr weh“, kann aber die genaue Stärke schwer beschreiben.","q":"Welche Frage kann helfen?","options":["Sie müssen eine genaue Diagnose nennen.","Schmerzen sind normal, ignorieren Sie sie.","Das kann nicht so schlimm sein.","Wenn null kein Schmerz und zehn der stärkste vorstellbare Schmerz ist: Welche Zahl passt gerade am besten?"],"correct":3,"why":"Eine verständlich erklärte Schmerzskala kann die Selbsteinschätzung erleichtern, sofern sie im Setting vorgesehen ist.","id":"s29","topicId":"t29","sceneZh":"一位患者说“非常疼”，但不太会描述疼痛的具体程度。","qZh":"怎样提问可能更有帮助？","whyZh":"清楚说明疼痛量表的含义，再请患者选择最接近当前感受的数字，能让自我评估更容易。","optionsZh":["您必须说出准确的诊断。","疼痛很正常，忽略就好。","没那么严重。","如果0代表完全不痛、10代表能想象到的最严重疼痛，您现在会选几？"]},{"topic":30,"title":"Herzdiagnose","scene":"Ein Patient möchte wissen, was der Begriff „Herzinsuffizienz“ bedeutet. Du bist nicht für die medizinische Aufklärung zuständig.","q":"Wie reagierst du?","options":["Ich gebe eine Diagnose ab.","Ich kann den Begriff sprachlich einordnen und organisiere eine Erklärung durch die zuständige Fachperson.","Das bedeutet immer dasselbe wie Herzinfarkt.","Ich verspreche, dass alles ungefährlich ist."],"correct":1,"why":"Begriffe nicht miteinander verwechseln und medizinische Aufklärung an die zuständige Fachperson weiterleiten.","id":"s30","topicId":"t30","sceneZh":"一位患者想知道“心力衰竭”是什么意思，而你并不负责医学解释。","qZh":"应该怎样回应？","whyZh":"应避免把心力衰竭和心肌梗死混为一谈。超出本人职责的医学解释应转交给相关专业人员。","optionsZh":["我直接给出诊断。","我可以解释这个词的大意，并请负责的专业人员为您进一步说明。","这和心肌梗死永远是同一回事。","我保证这完全没有危险。"]},{"topic":31,"title":"Notfallkommunikation","scene":"Du beobachtest eine plötzlich lebensbedrohlich wirkende Situation.","q":"Welche Aussage ist a function topicHTML(id){const t=getTopic(id);const n=topicProgress(id);return `<div class="viewtitle"><div><div class="eyebrow">THEMA ${String(t.id.slice(1)).padStart(2,'0')} · ${esc(t.group)}</div><h1>${esc(t.title)}</h1><p>${esc(t.desc)}</p></div><button class="secondary" data-action="setView" data-view="topics">← 返回主题</button></div><div class="stats"><div class="stat"><div class="statlabel">本主题词条</div><div class="statnum">${t.terms.length}</div><div class="statsub">基础专业词汇</div></div><div class="stat"><div class="statlabel">已接触词条</div><div class="statnum">${t.terms.filter(x=>state.seen[x.id]).length}</div><div class="statsub">${n}% 词汇进度</div></div><div class="stat"><div class="statlabel">错题待复习</div><div class="statnum">${state.mistakes.filter(x=>ALL_TERMS.find(v=>v.id===x)?.topicId===t.id).length}</div><div class="statsub">可随时重新练习</div></div><div class="stat"><div class="statlabel">学习建议</div><div class="statnum" style="font-size:21px">10–15 分钟</div><div class="statsub">词义、冠词与情境结合</div></div></div><div class="sectionhead"><div><h2>开始训练</h2><p>只练这个主题，减少切换成本。</p></div></div><div class="modegrid"><button class="modecard" data-action="startQuiz" data-mode="mixed" data-topic="${id}"><div class="modeemoji">⚡</div><strong>主题综合题</strong><small>词义、冠词、语境填空</small></button><button class="modecard" data-action="startQuiz" data-mode="meaning" data-topic="${id}"><div class="modeemoji">文</div><strong>词义理解</strong><small>德语词汇 ↔ 中文释义</small></button><button class="modecard" data-action="startQuiz" data-mode="article" data-topic="${id}"><div class="modeemoji">der</div><strong>冠词训练</strong><small>der · die · das</small></button><button class="modecard" data-action="startQuiz" data-mode="cloze" data-topic="${id}"><div class="modeemoji">___</div><strong>语境填空</strong><small>读句子，辨认专业术语</small></button></div><div class="sectionhead"><div><h2>本主题词汇</h2><p>收藏星标词条可在“我的收藏”中集中复习。</p></div><button class="textlink" data-action="startFlash" data-topic="${id}">开始闪卡 →</button></div><div class="panel">${t.terms.map((v,i)=>termRow(v,i)).join('')}</div>`}
function termRow(v,i){const saved=state.saved.includes(v.id);return `<div class="termrow"><span class="termnum">${String(i+1).padStart(2,'0')}</span><div class="termcontent"><strong>${esc(v.term)} <span style="font-size:11px;color:#93a8c2;font-weight:500">· ${esc(v.zh)}</span></strong><small>${esc(v.example)}</small></div><button class="starbtn ${saved?'saved':''}" data-action="toggleSaved" data-id="${v.id}" title="收藏">${saved?'★':'☆'}</button></div>`}
function buildQuestions(mode,topicId='all',ids=null){let pool=ids?ALL_TERMS.filter(t=>ids.includes(t.id)):ALL_TERMS.filter(t=>topicId==='all'||t.topicId===topicId);let qs=[];const seenQ=new Set();function add(q){if(!seenQ.has(q.id)){seenQ.add(q.id);qs.push(q)}}
const allZh=ALL_TERMS.map(t=>t.zh);const allTerms=ALL_TERMS.map(t=>t.term);function chooseDistractors(poolList,correct,n,seed){const candidates=poolList.filter(x=>x!==correct);const out=[];let k=0;while(out.length<n&&k<candidates.length*3+20){const val=candidates[(seed*13+k*7+Math.floor(k/3)*5)%candidates.length];if(val!==correct&&!out.includes(val))out.push(val);k++}return out.slice(0,n)}
for(const v of pool){if(mode==='mixed'||mode==='meaning'){let vals=[v.zh,...chooseDistractors(allZh,v.zh,3,parseInt(v.id.slice(1)))];vals=shuffleDeterministic(vals,parseInt(v.id.slice(1))*3+5);add({id:`m-${v.id}`,type:'词义理解',prompt:`„${v.term}“ 的意思是什么？`,hint:'选择最贴近护理工作场景的中文释义。',options:vals,correct:vals.indexOf(v.zh),termId:v.id,explanation:`${v.term}：${v.zh}。例句：${v.example}`})}
if(mode==='mixed'||mode==='article'){const article=v.term.split(' ')[0];const articleOptions=shuffleDeterministic(['der','die','das'],parseInt(v.id.slice(1))*19+1);add({id:`a-${v.id}`,type:'冠词训练',prompt:`哪个冠词与「${v.term.replace(/^(der|die|das)\s/i,'')}」搭配正确？`,hint:'注意德语名词的语法性别；本题练习词条的基本形式。',options:articleOptions,correct:articleOptions.indexOf(article),termId:v.id,explanation:`正确形式是 ${v.term}。中文释义：${v.zh}。`})}
if(mode==='mixed'||mode==='cloze'){let phrase=v.term;let sent=v.example.replace(new RegExp(escapeRegExp(phrase),'i'),'_____');let vals=[v.term,...chooseDistractors(allTerms,v.term,3,parseInt(v.id.slice(1))+9)];vals=shuffleDeterministic(vals,parseInt(v.id.slice(1))*11+2);add({id:`c-${v.id}`,type:'语境填空',prompt:'选择最符合中文提示的专业词汇。',hint:`中文提示：${v.zh}`,sentence:sent,options:vals,correct:vals.indexOf(v.term),termId:v.id,explanation:`正确答案：${v.term}（${v.zh}）。${v.example}`})}}
return shuffle(qs)}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function shuffleDeterministic(arr,seed){let a=arr.slice();for(let i=a.length-1;i>0;i--){seed=(seed*9301+49297)%233280;let j=Math.floor(seed/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(mode='mixed',topic='all',source=false){quizMode=mode;quizTopic=topic;quizSource=source===true?'mistakes':Array.isArray(source)?'saved':'all';const ids=source===true?state.mistakes.slice():Array.isArray(source)?source.slice():null;const allQuestions=buildQuestions(mode,topic,ids);quizQuestions=allQuestions.slice(0,quizLimit==='all'?allQuestions.length:Number(quizLimit));qi=0;currentAnswered=false;currentScenario=false;setView('quiz')}
function quizHTML(){if(!quizQuestions.length)return `<div class="viewtitle"><div><div class="eyebrow">TRAINING SESSION</div><h1>智能刷题</h1><p>当前筛选条件下没有可用题目。</p></div></div><div class="empty"><div class="big">✣</div><h3>还没有可练的题目</h3><p>换一个主题，或先收藏／答错一些词条再复习。</p><button class="primary" data-action="setView" data-view="topics">选择主题</button></div>`;if(qi>=quizQuestions.length)return quizDoneHTML();const q=quizQuestions[qi];const progress=Math.round(qi/quizQuestions.length*100);const modeLabel={mixed:'综合训练',meaning:'词义理解',article:'冠词训练',cloze:'语境填空'}[quizMode]||'复习训练';return `<div class="viewtitle"><div><div class="eyebrow">FOCUSED PRACTICE · ${modeLabel}</div><h1>${quizTopic==='all'?'护理德语综合训练':esc(getTopic(quizTopic).title)}</h1><p>每题即时反馈。答错会自动进入错题复习。</p></div><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><select class="select" id="quizSize"><option value="10" ${String(quizLimit)==='10'?'selected':''}>10 题挑战</option><option value="20" ${String(quizLimit)==='20'?'selected':''}>20 题训练</option><option value="50" ${String(quizLimit)==='50'?'selected':''}>50 题强化</option><option value="all" ${quizLimit==='all'?'selected':''}>完整题库</option></select><button class="secondary" data-action="setView" data-view="topics">退出训练</button></div></div><div class="quizlayout"><section class="quizcard"><div class="quiztop"><span class="qtype">${q.type}</span><span class="qcount">第 ${qi+1} 题 / ${quizQuestions.length}</span></div><div class="progressline"><span style="width:${progress}%"></span></div><h2 class="qprompt ${q.type==='语境填空'?'qprompt-instruction':''}">${esc(q.prompt)}</h2>${q.type==='语境填空'?`<div class="clozeClue"><small>中文提示 · 请理解词义</small><strong>${esc(String(q.hint||'').replace(/^中文提示：/,''))}</strong></div>`:`<p class="qhint">${esc(q.hint||'认真阅读题干，选择最合适的答案。')}</p>`}${q.sentence?`<div class="sentencebox">${esc(q.sentence)}</div>`:''}<div class="answers">${q.options.map((o,i)=>`<button class="answer" data-action="answerQuiz" data-index="${i}" ${currentAnswered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="feedback" id="quizFeedback"></div><div class="quizfoot"><button class="ghost" data-action="skipQuiz">暂时跳过</button><button class="primary" id="nextQuiz" data-action="nextQuiz" ${currentAnswered?'':'disabled'}>${qi===quizQuestions.length-1?'查看训练结果':'下一题 →'}</button></div></section><aside class="sidepanel"><section class="sidebox"><h3>本次训练</h3><div class="scorebig">${qi}<small> / ${quizQuestions.length}</small></div><div class="miniProgress"><span style="width:${progress}%"></span></div><div class="scoreline"><span>已作答</span><b>${qi}</b></div><div class="scoreline"><span>当前准确率</span><b>${state.answered?accuracy()+'%':'—'}</b></div><div class="scoreline"><span>错题本</span><b>${state.mistakes.length}</b></div></section><section class="sidebox"><h3>答题小建议</h3><p class="tip">先看整个词组，不要只记名词中文。护理德语中，<b>冠词、搭配和情境</b>同样重要。错误答案会被保存，之后可集中复习。</p></section><section class="sidebox"><h3>快捷切换</h3><button class="secondary" style="width:100%;margin-bottom:8px" data-action="startQuiz" data-mode="article" data-topic="${quizTopic}">只练冠词</button><button class="secondary" style="width:100%" data-action="startFlash" data-topic="${quizTopic}">改用闪卡</button></section></aside></div>`}
function answerQuiz(index){if(currentAnswered)return;const q=quizQuestions[qi];currentAnswered=true;state.answered++;markDaily();const right=index===q.correct;if(right)state.right++;const term=q.termId;if(term)state.seen[term]=true;if(!right&&term&&!state.mistakes.includes(term))state.mistakes.push(term);if(right&&term)state.mistakes=state.mistakes.filter(x=>x!==term);saveState();const buttons=[...document.querySelectorAll('.answer')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');if(i===index&&!right)b.classList.add('wrong')});const fb=document.getElementById('quizFeedback');fb.className=`feedback show ${right?'good':'bad'}`;fb.innerHTML=`<strong>${right?'✓ 回答正确，继续保持！':'需要再记一下这组词。'}</strong>${esc(q.explanation)}`;const nx=document.getElementById('nextQuiz');if(nx){nx.disabled=false;nx.textContent=qi===quizQuestions.length-1?'查看训练结果':'下一题 →'}document.querySelectorAll('.mistakeNavCount').forEach(x=>x.textContent=state.mistakes.length);}
function quizDoneHTML(){const sessionCorrect=quizQuestions.filter(q=>state.seen[q.termId]&&!state.mistakes.includes(q.termId)).length;return `<div class="casecard" style="max-width:850px;margin:20px auto;text-align:center"><div style="font-size:52px;margin:8px">✦</div><div class="eyebrow" style="justify-content:center">SESSION COMPLETE</div><h2>训练完成，继续积累专业表达力。</h2><p style="color:var(--muted);font-size:13px">这轮一共完成 ${quizQuestions.length} 道题。错题已经加入复习列表，建议稍后再练一次巩固。</p><div class="stats" style="text-align:left"><div class="stat"><div class="statlabel">本轮题数</div><div class="statnum">${quizQuestions.length}</div></div><div class="stat"><div class="statlabel">累计正确率</div><div class="statnum">${accuracy()}%</div></div><div class="stat"><div class="statlabel">错题待复习</div><div class="statnum">${state.mistakes.length}</div></div><div class="stat"><div class="statlabel">累计答题</div><div class="statnum">${state.answered}</div></div></div><div class="heroBtns" style="justify-content:center"><button class="primary" data-action="startQuiz" data-mode="mixed" data-topic="${quizTopic}">再练一轮 →</button><button class="secondary" data-action="setView" data-view="mistakes">复习错题</button><button class="secondary" data-action="setView" data-view="home">返回总览</button></div></div>`}

function startFlash(topic='all',ids=null){const pool=ids?ALL_TERMS.filter(x=>ids.includes(x.id)):ALL_TERMS.filter(x=>topic==='all'||x.topicId===topic);currentFlash=shuffle(pool);fi=0;flashBack=false;lastTopic=topic==='all'?lastTopic:topic;setView('flash')}
function flashHTML(){if(!currentFlash.length)return `<div class="empty"><div class="big">▣</div><h3>这里暂时没有词条</h3><p>可以去主题课程选择想学的内容。</p><button class="primary" data-action="setView" data-view="topics">打开主题</button></div>`;if(fi>=currentFlash.length)fi=0;const v=currentFlash[fi],saved=state.saved.includes(v.id);return `<div class="viewtitle"><div><div class="eyebrow">VOCABULARY FLASHCARDS</div><h1>词汇闪卡</h1><p>先回忆意思，再翻面查看释义与例句。标记“不熟悉”的词条会进入重点复习。</p></div><select class="select" id="flashTopic"><option value="all">全部词条</option>${DATA.topics.map(t=>`<option value="${t.id}" ${lastTopic===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><div class="flashstage"><div><div class="flashcard" id="flashCard" role="button" tabindex="0"><div class="flashmeta"><span>${esc(v.topicTitle)}</span><span>${fi+1} / ${currentFlash.length}</span></div><div class="flashword">${esc(v.term)}</div><div class="flashhint">点击卡片翻面 · Tap to reveal</div>${flashBack?`<div class="flashback"><div class="flashzh">${esc(v.zh)}</div><p class="flashexample">${esc(v.example)}</p></div>`:''}</div><div class="flashactions"><button class="secondary" data-action="flashPrev">← 上一个</button><button class="ghost" data-action="toggleSaved" data-id="${v.id}">${saved?'★ 已收藏':'☆ 收藏词条'}</button><button class="primary" data-action="flashNext">${flashBack?'记住了，下一张':'翻开答案 ↻'}</button></div></div><aside class="flashside"><div class="eyebrow">LEARNING TIP</div><h3>不要只背中文</h3><p>先朗读德语词条，留意名词的冠词。翻面后读一遍例句，再试着用自己的工作场景造一个句子。</p><div class="miniProgress"><span style="width:${Math.round((fi+1)/currentFlash.length*100)}%"></span></div><div class="scoreline"><span>当前卡片</span><b>${fi+1} / ${currentFlash.length}</b></div><div class="scoreline"><span>已收藏</span><b>${state.saved.length}</b></div><div class="scoreline"><span>重点复习</span><b>${state.mistakes.length}</b></div><button class="secondary" style="width:100%;margin-top:18px" data-action="startQuiz" data-mode="article" data-topic="${lastTopic==='all'?'all':lastTopic}">用冠词测试一下 →</button></aside></div>`}

function scenarioHTML(){if(!currentScenarios.length){currentScenarios=shuffle(DATA.scenarios);si=0;scenarioAnswered=false}if(si>=currentScenarios.length)return `<div class="empty"><div class="big">✦</div><h3>全部情境练习完成</h3><p>再来一轮，试着把正确表达读出声。</p><button class="primary" data-action="restartScenarios">再练一轮</button></div>`;const s=currentScenarios[si],t=getTopic(s.topicId);return `<div class="viewtitle"><div><div class="eyebrow">CARE COMMUNICATION · ROLLENSPIEL</div><h1>护理情境训练</h1><p>练习礼貌、清晰、准确的工作沟通。共 ${currentScenarios.length} 个情境。</p></div><span class="pill">${si+1} / ${currentScenarios.length}</span></div><div class="casecard"><span class="casebadge">THEMA ${String(s.topic).padStart(2,'0')} · ${esc(t.title)}</span><h2>${esc(s.title)}</h2><div class="scene">${esc(s.scene)}</div><div class="scenezh"><strong>情境理解：</strong> ${esc(s.sceneZh||'请结合德语情境理解患者和护理团队的需求。')}</div><h3 class="scenarioQuestion" style="font-size:18px;line-height:1.6;margin-bottom:6px">${esc(s.q)}</h3><div class="qzh"><strong>问题意思：</strong> ${esc(s.qZh||'请判断哪种表达最合适。')}</div><div class="answers">${s.options.map((o,i)=>`<button class="answer" data-action="answerScenario" data-index="${i}" ${scenarioAnswered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="feedback" id="scenarioFeedback"></div><div class="quizfoot"><button class="ghost" data-action="skipScenario">跳过</button><button class="primary" data-action="nextScenario" id="nextScenario" ${scenarioAnswered?'':'disabled'}>${si===currentScenarios.length-1?'完成情境训练':'下一个情境 →'}</button></div></div><p class="tip" style="margin-top:15px">提示：这是语言学习情境。实际工作请始终遵循机构流程、专业培训与个人职责范围。</p>`}
function answerScenario(index){if(scenarioAnswered)return;scenarioAnswered=true;const s=currentScenarios[si];state.answered++;markDaily();const good=index===s.correct;if(good)state.right++;saveState();document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===s.correct)b.classList.add('correct');if(i===index&&!good)b.classList.add('wrong')});const fb=document.getElementById('scenarioFeedback');const correctZh=(s.optionsZh&&s.optionsZh[s.correct])||'请结合中文讲解理解这一表达。';const chosenZh=(s.optionsZh&&s.optionsZh[index])||'';const allOptions=(s.options||[]).map((o,i)=>`<li><b>${'ABCD'[i]}${i===s.correct?' · 正确答案':''}${i===index&&i!==s.correct?' · 你的选择':''}</b> ${esc(o)}<span>${esc((s.optionsZh&&s.optionsZh[i])||'')}</span></li>`).join('');fb.className=`feedback show ${good?'good':'bad'}`;fb.innerHTML=`<strong>${good?'✓ 回答正确！表达得体。':'✕ 这次选择不合适，看看原因。'}</strong><div class="scenario-explain"><b>中文讲解：</b>${esc(s.whyZh||'选择表达时，应注意患者安全、尊重、清晰沟通和机构流程。')}<br><span style="display:block;color:#aebfd4;margin-top:6px"><b>德语说明：</b>${esc(s.why||'')}</span></div><div class="scenario-correct"><b>正确表达：</b><br>${esc(s.options[s.correct])}<span>${esc(correctZh)}</span></div>${!good?`<div class="scenario-selected"><b>你的选择：</b><br>${esc(s.options[index])}<span>${esc(chosenZh)}</span></div>`:''}<details class="scenario-options-review"><summary>查看全部选项的中文解释</summary><ol>${allOptions}</ol></details>`;document.getElementById('nextScenario').disabled=false}

function restartScenarios(){currentScenarios=shuffle(DATA.scenarios);si=0;scenarioAnswered=false;render()}
function toggleSaved(id){const i=state.saved.indexOf(id);if(i>=0){state.saved.splice(i,1);showToast('已从收藏中移除')}else{state.saved.push(id);showToast('已加入我的收藏 ★')}saveState();render()}
function collectionHTML(kind){const ids=kind==='mistakes'?state.mistakes:state.saved;const list=ids.map(id=>ALL_TERMS.find(v=>v.id===id)).filter(Boolean);const title=kind==='mistakes'?'错题复习':'我的收藏';if(!list.length)return `<div class="viewtitle"><div><div class="eyebrow">${kind==='mistakes'?'REVIEW QUEUE':'SAVED WORDS'}</div><h1>${title}</h1><p>${kind==='mistakes'?'答错的词条会自动进入这里。多练习一次，逐步清空错题。':'把重要词条收藏起来，建立自己的护理德语词库。'}</p></div></div><div class="empty"><div class="big">${kind==='mistakes'?'↻':'☆'}</div><h3>${kind==='mistakes'?'错题本清爽得很！':'还没有收藏词条'}</h3><p>${kind==='mistakes'?'练习时答错的词会自动收集到这里。':'在主题词汇表或闪卡中点击星标即可收藏。'}</p><button class="primary" data-action="setView" data-view="topics">去练习 →</button></div>`;return `<div class="viewtitle"><div><div class="eyebrow">${kind==='mistakes'?'REVIEW QUEUE':'SAVED WORDS'}</div><h1>${title}</h1><p>共 ${list.length} 个词条，适合集中复习或重新测试。</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-action="startQuiz" data-mode="mixed" data-from="${kind}">开始测试 →</button><button class="secondary" data-action="startFlash" data-from="${kind}">闪卡复习</button></div></div><div class="panel">${list.map((v,i)=>termRow(v,i)).join('')}</div><div style="margin-top:14px;text-align:right"><button class="ghost" data-action="clearCollection" data-kind="${kind}">清空${kind==='mistakes'?'错题本':'收藏'}</button></div>`}
function glossaryHTML(){let index=0;return `<div class="viewtitle"><div><div class="eyebrow">NURSING VOCABULARY INDEX</div><h1>专业词汇库</h1><p>按 40 个护理主题分类浏览，共 ${ALL_TERMS.length} 个专业词条；每个词条附有中文释义与德语例句。</p></div></div><div class="panel"><div class="panelhead"><h3>全部专业词汇</h3><small>${ALL_TERMS.length} 个条目 · 按主题排列</small></div>${DATA.topics.map(t=>`<section class="glossaryTopic"><div class="glossaryTopicHead"><h3>${esc(t.title)}</h3><span>${t.terms.length} 个词条</span></div><p>${esc(t.desc)}</p>${t.terms.map(v=>termRow(v,index++)).join('')}</section>`).join('')}</div>`}
function bindDynamic(){const groupSel=document.getElementById('groupSelect');if(groupSel){groupSel.value=groupFilter;if(groupSel.dataset.boundGroupSelect!=='1'){groupSel.dataset.boundGroupSelect='1';groupSel.addEventListener('change',()=>{groupFilter=groupSel.value;document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===groupFilter));filterTopics()})}}document.querySelectorAll('[data-group]').forEach(b=>{if(b.dataset.boundGroup==='1')return;b.dataset.boundGroup='1';b.addEventListener('click',()=>{groupFilter=b.dataset.group;document.querySelectorAll('[data-group]').forEach(x=>x.classList.toggle('active',x.dataset.group===groupFilter));if(groupSel)groupSel.value=groupFilter;filterTopics()})});const qs=document.getElementById('quizSize');if(qs)qs.addEventListener('change',()=>{quizLimit=qs.value;const src=quizSource==='mistakes'?true:quizSource==='saved'?state.saved.slice():false;startQuiz(quizMode,quizTopic,src)});const ft=document.getElementById('flashTopic');if(ft)ft.addEventListener('change',()=>startFlash(ft.value));const card=document.getElementById('flashCard');if(card){card.addEventListener('click',flipFlash);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flipFlash()}})}document.querySelectorAll('[data-action]').forEach(el=>{if(el.dataset.bound==='1')return;el.dataset.bound='1';el.addEventListener('click',e=>{const a=el.dataset.action;const d=el.dataset;if(a==='setView')setView(d.view);else if(a==='openTopic'){lastTopic=d.topic;setView('topic')}else if(a==='startQuiz'){const src=d.from==='mistakes'?true:d.from==='saved'?state.saved.slice():false;startQuiz(d.mode||'mixed',d.topic||'all',src);}else if(a==='startFlash'){const kind=d.from;startFlash(d.topic||'all',kind==='mistakes'?state.mistakes:kind==='saved'?state.saved:null)}else if(a==='answerQuiz')answerQuiz(Number(d.index));else if(a==='nextQuiz')nextQuiz();else if(a==='skipQuiz')skipQuiz();else if(a==='toggleSaved')toggleSaved(d.id);else if(a==='flashNext')flashBack?flashNext():flipFlash();else if(a==='flashPrev')flashPrev();else if(a==='answerScenario')answerScenario(Number(d.index));else if(a==='nextScenario')nextScenario();else if(a==='skipScenario'){si++;scenarioAnswered=false;render()}else if(a==='restartScenarios')restartScenarios();else if(a==='clearCollection'){if(confirm('确定清空这份列表吗？')){if(d.kind==='mistakes')state.mistakes=[];else state.saved=[];saveState();render();showToast('已清空')}}});});const nq=document.getElementById('nextQuiz');if(nq)nq.disabled=!currentAnswered;}
function filterTopics(){const grid=document.getElementById('topicGrid');if(grid){grid.innerHTML=DATA.topics.filter(t=>groupFilter==='Alle Themen'||t.group===groupFilter).map(topicCard).join('')||'<div class="empty">没有这个类别的主题。</div>';bindDynamic()}}
// Event delegation for static navigation, including nav items.
document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.view;if(v==='quiz')startQuiz(b.dataset.mode||'mixed');else setView(v)}));
document.getElementById('mobileMenuBtn').addEventListener('click',toggleMobileNav);
document.getElementById('mobileBackBtn').addEventListener('click',goBack);
document.getElementById('mobileResetProgress').addEventListener('click',()=>document.getElementById('resetProgress').click());
document.getElementById('navBackdrop').addEventListener('click',closeMobileNav);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileNav()});
document.getElementById('resetProgress').addEventListener('click',()=>{if(confirm('确定重置本机所有学习进度、错题和收藏吗？此操作不可撤销。')){localStorage.removeItem(STORE_KEY);state=blankState();quizQuestions=[];currentFlash=[];render();showToast('本机学习进度已重置')}});
// Global action buttons inside rendered screens are bound by bindDynamic.
updateDaily();render();
</script>
</body>
</html>
